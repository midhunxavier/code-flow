<script>
// The theme you picked (ui/theme.ts), applied before the first paint so the page never flashes the other one.
try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
