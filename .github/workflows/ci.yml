name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: macos-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Merging a result into your checkout commits as you, so the tests need an identity.
      - run: |
          git config --global user.name "code-flow CI"
          git config --global user.email "ci@code-flow.invalid"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The real UI in headless Chrome (preinstalled on GitHub's Ubuntu runners) against fake
  # agents. Informational for now: a browser-driven test is the likeliest to flake on CI.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          git config --global user.name "code-flow CI"
          git config --global user.email "ci@code-flow.invalid"
      - run: npm ci
      - run: npm run test:e2e
