name: CI

on:
  push:
    # PR updates run below; duplicate push checks can be cancelled and block merging.
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.13.0" }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Merging a result into your checkout commits as you, so the tests need an identity.
      - run: |
          git config --global user.name "code-flow CI"
          git config --global user.email "ci@code-flow.invalid"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    name: Installed npm launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:npm
      - run: npm run test:package

  desktop:
    name: macOS desktop lifecycle
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:macos
      - run: npm run test:macos
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-evidence
          path: output/playwright/desktop-*.png

  windows-desktop:
    uses: ./.github/workflows/windows-desktop.yml

  # Critical UI flows in headless Chrome against deterministic provider fixtures.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          git config --global user.name "code-flow CI"
          git config --global user.email "ci@code-flow.invalid"
      - run: npm ci
      - name: Install browser video encoder
        run: node node_modules/playwright-core/cli.js install ffmpeg
      - run: npm run test:e2e
      - name: Save browser screenshots and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: |
            output/playwright/**/*.png
            output/playwright/**/*.webm
          if-no-files-found: ignore
          retention-days: 7

  vscode:
    name: VS Code extension host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Download official stable VS Code
        run: |
          curl --fail --location --retry 2 https://update.code.visualstudio.com/latest/linux-x64/stable --output "$RUNNER_TEMP/vscode.tar.gz"
          mkdir "$RUNNER_TEMP/vscode"
          tar -xzf "$RUNNER_TEMP/vscode.tar.gz" -C "$RUNNER_TEMP/vscode" --strip-components=1
          sudo chown root:root "$RUNNER_TEMP/vscode/chrome-sandbox"
          sudo chmod 4755 "$RUNNER_TEMP/vscode/chrome-sandbox"
      - name: Exercise real extension host with fake agents
        run: |
          git config --global user.name "code-flow CI"
          git config --global user.email "ci@code-flow.invalid"
          xvfb-run -a npm run test:vscode
        env:
          CODEFLOW_VSCODE_BIN: ${{ runner.temp }}/vscode/code
      - run: npm run package:vscode
      - uses: actions/upload-artifact@v4
        with:
          name: code-flow-vscode
          path: output/vscode/*.vsix

  rust-experiment:
    name: Rust transcript parity (experiment only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo fmt --check --manifest-path experiments/rust-transcript/Cargo.toml
      - run: cargo clippy --locked --manifest-path experiments/rust-transcript/Cargo.toml -- -D warnings
      - run: npm run test:rust
