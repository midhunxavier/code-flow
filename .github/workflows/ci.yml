name: CI

on:
  push:
    # PR updates run below; duplicate push checks can be cancelled and block merging.
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Skips the jobs below when nothing needs testing: a merge to main that is identical to a
  # pull request head that already passed, or a documentation-only change. See scripts/ci-changes.sh.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/ci-changes.sh

  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    # The full macOS suite can exceed 40 minutes on shared hosted runners.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.13.0" }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Merging a result into your checkout commits as you, so the tests need an identity.
      - run: |
          git config --global user.name "code-flow CI"
          git config --global user.email "ci@code-flow.invalid"
      - run: npm ci
      - name: Configure isolated Chrome on macOS
        if: runner.os == 'macOS'
        run: |
          wrapper="$RUNNER_TEMP/codeflow-qa-chrome"
          printf '#!/bin/sh\nexec "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --use-mock-keychain "$@"\n' > "$wrapper"
          chmod 700 "$wrapper"
          echo "CODEFLOW_CHROME=$wrapper" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
        if: runner.os != 'macOS'
      - name: Run full macOS suite with bounded fixture concurrency
        if: runner.os == 'macOS'
        run: npx tsx --test --test-concurrency=2 test/*.test.ts test/managed-updates.test.mjs test/desktop/*.test.mjs

  package:
    name: Installed npm launcher (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:npm
      - run: npm run test:package

  desktop:
    name: macOS desktop lifecycle
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:macos
      - run: npm run test:macos
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-evidence
          path: output/playwright/desktop-*.png

  windows-desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/windows-desktop.yml

  # Critical UI flows in headless Chrome against deterministic provider fixtures.
  e2e:
    name: Browser acceptance (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          git config --global user.name "code-flow CI"
          git config --global user.email "ci@code-flow.invalid"
      - run: npm ci
      - name: Install browser video encoder
        run: node node_modules/playwright-core/cli.js install ffmpeg
      - name: Run one deterministic third of browser acceptance
        env:
          QA_SHARD: ${{ matrix.shard }}
        run: |
          files=(test/e2e/*.e2e.ts)
          selected=()
          for i in "${!files[@]}"; do
            if (( i % 3 == QA_SHARD )); then selected+=("${files[$i]}"); fi
          done
          test "${#selected[@]}" -gt 0
          printf '%s\n' "${selected[@]}"
          npx tsx --test --test-concurrency=2 "${selected[@]}"
      - name: Save browser screenshots and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence-${{ matrix.shard }}
          path: |
            output/playwright/**/*.png
            output/playwright/**/*.webm
            output/playwright/**/failed-page.txt
          if-no-files-found: ignore
          retention-days: 7

  # The single check branch protection requires. Skipped jobs count as passing, so a skipped
  # run can merge; a failed or cancelled job (or a failed change check) blocks the merge.
  # Browser acceptance is reported above but not required here until its flaky tests are fixed.
  ci-ok:
    name: CI result
    if: always()
    needs: [changes, test, package, desktop, windows-desktop, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '
            .changes.result == "success" and
            ([.test, .package, .desktop, ."windows-desktop"] | all(.result == "success" or .result == "skipped")) and
            (.changes.outputs.code != "true" or .test.result == "success")
          ' > /dev/null
