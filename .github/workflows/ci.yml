name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.13.0" }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Merging a result into your checkout commits as you, so the tests need an identity.
      - run: |
          git config --global user.name "code-flow CI"
          git config --global user.email "ci@code-flow.invalid"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Critical UI flows in headless Chrome against deterministic provider fixtures.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          git config --global user.name "code-flow CI"
          git config --global user.email "ci@code-flow.invalid"
      - run: npm ci
      - run: npm run test:e2e

  vscode:
    name: VS Code extension host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Download official stable VS Code
        run: |
          curl --fail --location --retry 2 https://update.code.visualstudio.com/latest/linux-x64/stable --output "$RUNNER_TEMP/vscode.tar.gz"
          mkdir "$RUNNER_TEMP/vscode"
          tar -xzf "$RUNNER_TEMP/vscode.tar.gz" -C "$RUNNER_TEMP/vscode" --strip-components=1
          sudo chown root:root "$RUNNER_TEMP/vscode/chrome-sandbox"
          sudo chmod 4755 "$RUNNER_TEMP/vscode/chrome-sandbox"
      - name: Exercise real extension host with fake agents
        run: |
          git config --global user.name "code-flow CI"
          git config --global user.email "ci@code-flow.invalid"
          xvfb-run -a npm run test:vscode
        env:
          CODEFLOW_VSCODE_BIN: ${{ runner.temp }}/vscode/code
      - run: npm run package:vscode
      - uses: actions/upload-artifact@v4
        with:
          name: code-flow-vscode
          path: output/vscode/*.vsix

  rust-experiment:
    name: Rust transcript parity (experiment only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo fmt --check --manifest-path experiments/rust-transcript/Cargo.toml
      - run: cargo clippy --locked --manifest-path experiments/rust-transcript/Cargo.toml -- -D warnings
      - run: npm run test:rust
