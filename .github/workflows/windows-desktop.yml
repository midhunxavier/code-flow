name: Windows desktop

on:
  push:
    branches: [codex/windows-app]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  package:
    name: Windows package (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/desktop/*.test.mjs
      - run: npm run package:windows -- ${{ matrix.arch }}
      - run: npm run test:windows
        env:
          CODEFLOW_WINDOWS_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-${{ matrix.arch }}
          path: output/releases/*windows*
          if-no-files-found: error

  docker:
    name: Windows-built Docker runtime
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows-desktop-x64
          path: output/windows-download
      - name: Verify and extract the Windows-produced ZIP
        working-directory: output/windows-download
        run: |
          sha256sum --check *.sha256
          unzip -q *-windows-x64-unsigned.zip -d ../windows-unpacked
      - run: npm run test:desktop:docker
        env:
          CODEFLOW_DESKTOP_BUNDLE: ${{ github.workspace }}/output/windows-unpacked/Code Flow/resources/app
