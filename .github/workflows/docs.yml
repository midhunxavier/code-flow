name: Documentation
on:
  pull_request:
    paths: ['docs/**', 'README.md', 'integrations/vscode/README.md', 'ui/styles.css', 'ui/fonts/**', 'ui/brand/**', 'scripts/build-docs.mjs', 'package*.json', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'README.md', 'integrations/vscode/README.md', 'ui/styles.css', 'ui/fonts/**', 'ui/brand/**', 'scripts/build-docs.mjs', 'package*.json', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:docs
      - run: npm run test:docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
